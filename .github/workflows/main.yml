name: Student Result Management CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest -v --maxfail=1 --disable-warnings \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing

  sonarqube:
    name: SonarQube analysis
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  docker:
    name: Docker build and smoke test
    needs:
      - test
      - sonarqube
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t student-result-management:ci .

      - name: Run Docker container
        run: |
          docker run -d --name student-result-management -p 5000:5000 student-result-management:ci

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1; then
              echo "Application is healthy"
              break
            fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:5000/health
          curl -fsS http://127.0.0.1:5000/results/101

      - name: Cleanup container
        if: always()
        run: docker rm -f student-result-management || true
